# ArchGX settings applied on top of the stock RetroArch config (--appendconfig)
# --- saves in their own folder (save states: ArchGX copies them from RAM to saves/ slots 1-4)
savefile_directory = "/userdata/rom/saves"
savestate_directory = "/tmp/gx/states"
savefiles_in_content_dir = "false"
savestates_in_content_dir = "false"
sort_savefiles_enable = "false"
sort_savestates_enable = "false"
# --- RetroArch menu (reached from the ArchGX in-game menu): full menu, minus items that do nothing here
kiosk_mode_enable = "false"
quick_menu_show_take_screenshot = "false"
quick_menu_show_undo_save_load_state = "false"
quick_menu_show_add_to_favorites = "false"
quick_menu_show_information = "false"
quick_menu_show_save_core_overrides = "false"
quick_menu_show_save_game_overrides = "false"
quick_menu_show_save_content_dir_overrides = "false"
quick_menu_show_cheats = "false"
menu_show_load_core = "false"
menu_show_load_content = "false"
menu_show_online_updater = "false"
menu_show_core_updater = "false"
menu_show_information = "false"
menu_show_configurations = "false"
menu_show_help = "false"
menu_show_reboot = "false"
menu_show_shutdown = "false"
menu_show_quit_retroarch = "true"
content_show_settings = "false"
content_show_favorites = "false"
content_show_history = "false"
content_show_images = "false"
content_show_music = "false"
content_show_video = "false"
content_show_netplay = "false"
content_show_add = "false"
content_show_playlists = "false"
# --- no technical on-screen messages; resume only when ArchGX asks for it
video_font_enable = "false"
savestate_auto_save = "false"
savestate_auto_load = "false"
# --- ArchGX in-game menu (pce-launcher --ingame) drives RetroArch through stdin
stdin_cmd_enable = "true"
input_menu_toggle_gamepad_combo = "0"
pause_nonactive = "false"
state_slot = "0"
savestate_thumbnail_enable = "true"
video_gpu_screenshot = "false"
# --- performance: RetroArch's own frame-by-frame rewind (on in Hyperkin's config, 20 MB,
#     a save state every 10 frames) costs CPU in every game; ArchGX has its own rewind
rewind_enable = "false"
